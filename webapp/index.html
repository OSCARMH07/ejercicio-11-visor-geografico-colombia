<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colombia · Departamentos y municipios</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main>
    <aside>
      <h1>División territorial de Colombia</h1>
      <form id="search">
        <label for="name">Buscar departamento o municipio</label>
        <input id="name" type="search" required>
        <button disabled>Buscar</button>
      </form>
      <label for="department">Filtrar municipios por departamento</label>
      <select id="department" disabled><option value="">Todos</option></select>
      <div id="results"></div>
      <p id="status" role="status">Cargando datos de GeoServer…</p>
      <p id="info">Selecciona una entidad en el mapa para identificarla.</p>
    </aside>
    <div id="map" aria-label="Mapa de Colombia"></div>
  </main>
</body>
</html>
